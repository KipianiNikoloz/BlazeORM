name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.11.25"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run --frozen ruff check .
      - name: Format check (black)
        run: uv run --frozen black --check .
      - name: Import sort check (isort)
        run: uv run --frozen isort --check-only .
      - name: Type check (mypy)
        run: uv run --frozen mypy src
      - name: Tests
        env:
          BLAZE_POSTGRES_DSN: ${{ secrets.BLAZE_POSTGRES_DSN }}
          BLAZE_MYSQL_DSN: ${{ secrets.BLAZE_MYSQL_DSN }}
        run: uv run --frozen python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          version: "0.11.25"
          enable-cache: true
      - name: Build package
        run: |
          uv sync --frozen
          uv run --frozen python -m build
          uv run --frozen twine check dist/*

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: blaze
          POSTGRES_PASSWORD: blaze
          POSTGRES_DB: blazeorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blaze -d blazeorm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: blaze
          MYSQL_PASSWORD: blaze
          MYSQL_DATABASE: blazeorm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          version: "0.11.25"
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen --group integration
      - name: Integration tests
        env:
          BLAZE_POSTGRES_DSN: postgresql://blaze:blaze@localhost:5432/blazeorm
          BLAZE_MYSQL_DSN: mysql://blaze:blaze@localhost:3306/blazeorm
        run: uv run --frozen python -m pytest tests/integration
